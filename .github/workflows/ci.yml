name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write        # required by dorny/test-reporter to post check runs
  pull-requests: write # required to post coverage comment on the PR

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Test suite + coverage
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      # Surface individual test results as a GitHub Check so reviewers
      # can drill into failures directly from the PR page.
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Test Results
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: true

      # Upload the full HTML coverage report as a workflow artifact.
      # Reviewers can download it from the Actions run summary.
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Print a coverage summary to the workflow log.
      - name: Print coverage summary
        if: always()
        run: |
          echo "### Coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
              const fmt = (k) => \`\${k.padEnd(12)} \${String(d[k].pct+'%').padStart(7)}\`;
              console.log(fmt('statements'));
              console.log(fmt('branches'));
              console.log(fmt('functions'));
              console.log(fmt('lines'));
            " \
            >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Production build
  # Ensures the compiled artefact is always buildable, independent
  # of the test run, so build failures don't mask test failures.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript → dist/
        run: npm run build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
